<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GRNVS MCQ Practice</title>
    <meta name="description" content="Practice GRNVS exam MCQs as clean quiz cards." />
    <link rel="stylesheet" href="./styles.css?v=17" />
  </head>
  <body>
    <main class="app">
      <aside class="side">
        <div class="brand">
          <span>G</span>
          <div>
            <h1>GRNVS MCQ Practice</h1>
            <p id="total-label">Loading questions</p>
          </div>
        </div>

        <label class="field">
          <span>Mode</span>
          <select id="source-filter">
            <option value="practice">Topic practice</option>
            <option value="multi">Multiple-answer drill</option>
            <option value="review">Review mistakes</option>
            <option value="exam">Timed exam</option>
          </select>
        </label>

        <label class="field" id="topic-field">
          <span>Topic</span>
          <select id="topic-filter"></select>
        </label>

        <label class="field">
          <span>Search</span>
          <input id="search" placeholder="DNS, TCP, IPv6..." />
        </label>

        <div class="stats">
          <div><strong id="score-label">0/0</strong><span>first-try</span></div>
          <div><strong id="answered-label">0</strong><span>answered</span></div>
        </div>

        <div class="readiness" id="readiness-card">
          <span>Needs most work</span>
          <strong id="weakest-label">Answer a few questions</strong>
        </div>

        <div class="actions vertical">
          <a class="primary link-button" href="./archive/page-overlay-backup/index.html">Practice Original Papers</a>
          <a class="secondary link-button" href="./notes.html">Open Notes</a>
          <button id="shuffle-button" class="secondary">Shuffle</button>
          <button id="retry-button" class="secondary">Retry Mistakes</button>
          <button id="reset-button" class="secondary">Reset Answers</button>
        </div>
      </aside>

      <section class="quiz">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="mode-label">Paper-grounded topic practice</p>
            <h2 id="question-position">Question</h2>
          </div>
          <div class="actions">
            <strong id="timer-label" class="timer" hidden>30:00</strong>
            <button id="submit-button" class="submit-exam" hidden>Submit Exam</button>
          </div>
        </header>

        <article class="card">
          <div class="card-head">
            <span id="type-pill" class="pill">Multiple choice</span>
            <span id="source-pill" class="pill muted">Source</span>
          </div>
          <h3 id="question-text"></h3>
          <div id="option-list" class="options"></div>
          <footer class="footnote" id="year-footnote"></footer>
        </article>

        <div id="feedback" class="feedback"></div>

        <div class="actions bottom">
          <div class="actions answer-actions">
            <button id="check-button" class="primary">Check Answer</button>
            <button id="show-button" class="secondary">Show Answer</button>
          </div>
          <div class="actions navigation-actions">
            <button id="prev-button" class="secondary">Previous</button>
            <button id="next-button" class="primary">Next</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./extra-questions-data.js?v=3"></script>
    <script src="./paper-variants-data.js?v=1"></script>
    <script src="./multi-answer-data.js?v=3"></script>
    <script src="./app.js?v=6"></script>
  </body>
</html>
